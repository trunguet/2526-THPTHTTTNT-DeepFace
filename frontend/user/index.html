<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepFace - Nhân Viên</title>
    <link rel="stylesheet" href="../shared/background.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="user-container">
      <!-- Top Navigation -->
      <nav class="top-nav">
        <div class="nav-brand">
          <span>🎭</span>
          <span>DeepFace</span>
          <span style="color: #a0aec0; font-weight: 400; margin-left: 10px">- Nhân Viên</span>
        </div>
        <div class="nav-user-info">
          <div class="user-info">
            <div class="user-name" id="user-name-display">Nhân Viên</div>
            <div class="user-id" id="user-id-display">ID: --</div>
          </div>
          <a href="#logout" class="logout-btn" onclick="handleLogout()">🚪 Đăng Xuất</a>
        </div>
      </nav>

      <!-- Main Content -->
      <div class="content">
        <!-- Face Scan Section -->
        <div id="face-scan-section" class="section active">
          <div class="card">
            <h2 class="card-title">👤 Xác Thực Khuôn Mặt</h2>

            <div class="scan-container">
              <!-- Video Stream -->
              <div>
                <div class="video-container" id="video-container">
                  <video id="video-stream" width="640" height="480" autoplay></video>
                  <canvas id="canvas-stream" style="display: none"></canvas>
                </div>
              </div>

              <!-- Controls -->
              <div>
                <div id="status-display" class="status-display"></div>

                <div class="video-controls">
                  <div class="control-group">
                    <button class="btn btn-primary" id="start-btn">
                      <span>▶️</span>
                      <span>Khởi Động Camera</span>
                    </button>
                  </div>

                  <div class="control-group">
                    <button class="btn btn-warning" id="capture-btn" disabled>
                      <span>📸</span>
                      <span>Chụp & Xác Thực</span>
                    </button>
                  </div>

                  <div class="control-group">
                    <button class="btn btn-info" id="auto-scan-btn" disabled>
                      <span>🔄</span>
                      <span>Tự Động Quét</span>
                    </button>
                  </div>

                  <div class="control-group">
                    <button class="btn btn-secondary" id="stop-btn" disabled>
                      <span>⏹️</span>
                      <span>Dừng Camera</span>
                    </button>
                  </div>
                </div>

                <div class="help-card">
                  <h4 class="help-title">💡 Hướng Dẫn</h4>
                  <ul class="help-list">
                    <li>Nhấn "Khởi Động Camera" để bắt đầu</li>
                    <li>Đảm bảo khuôn mặt sáng rõ trong khung</li>
                    <li>Nhấn "Chụp & Xác Thực" để kiểm tra</li>
                    <li>Đợi kết quả xác thực</li>
                  </ul>
                </div>
              </div>
            </div>

            <!-- Result Display -->
            <div id="result-container" class="result-container"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- Background -->
    <script src="../shared/background.js"></script>
    <!-- Module Scripts -->
    <script src="../shared/api.js"></script>
    <script src="./api.js"></script>
    <script src="./face_scan.js"></script>
    <script>
      // User Info Display
      function loadUserInfo() {
        const userId = localStorage.getItem('employee_id');
        const userName = localStorage.getItem('employee_name');

        if (userId) {
          document.getElementById('user-id-display').textContent = `ID: ${userId}`;
        }
        if (userName) {
          document.getElementById('user-name-display').textContent = userName;
        }
      }

      function handleLogout() {
        if (confirm('Bạn có chắc chắn muốn đăng xuất?')) {
          localStorage.removeItem('auth_token');
          localStorage.removeItem('employee_id');
          localStorage.removeItem('employee_name');
          window.location.href = './login.html';
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        loadUserInfo();
      });
    </script>
  </body>
</html>
