<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dang Nhap Nhan Vien - DeepFace</title>
    <link rel="stylesheet" href="../shared/background.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="content" style="max-width: 520px; margin: 8vh auto">
      <div class="card">
        <h1 class="card-title">Dang Nhap Nhan Vien</h1>
        <form id="user-login-form" style="display: grid; gap: 14px">
          <input id="employee-id" placeholder="Ma nhan vien" value="EMP001" style="padding: 12px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(124,196,237,0.35); border-radius: 8px; color: #fff" />
          <input id="employee-name" placeholder="Ho ten" value="Nhan vien demo" style="padding: 12px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(124,196,237,0.35); border-radius: 8px; color: #fff" />
          <button class="btn btn-primary" type="submit">Bat Dau Demo</button>
          <a class="btn btn-secondary" href="./index.html">Ve Trang User</a>
          <div id="login-status" style="display: none; color: #10b981"></div>
        </form>
      </div>
    </main>
    <script src="../shared/background.js"></script>
    <script>
      document.getElementById('user-login-form').addEventListener('submit', (event) => {
        event.preventDefault();
        localStorage.setItem('auth_token', 'demo-user-token');
        localStorage.setItem('employee_id', document.getElementById('employee-id').value || 'EMP001');
        localStorage.setItem('employee_name', document.getElementById('employee-name').value || 'Nhan vien demo');
        document.getElementById('login-status').textContent = 'Da tao phien demo. Dang chuyen huong...';
        document.getElementById('login-status').style.display = 'block';
        setTimeout(() => (window.location.href = './index.html'), 500);
      });
    </script>
  </body>
</html>
