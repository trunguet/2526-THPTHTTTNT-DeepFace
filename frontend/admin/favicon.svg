<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="k8sBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ea8ff"/>
      <stop offset="1" stop-color="#2f6feb"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0B1220"/>

  <!-- Kubernetes-style ship wheel (original, not the official trademark artwork) -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="url(#k8sBlue)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="7" fill="#0B1220" stroke="url(#k8sBlue)" stroke-width="4"/>

  <!-- spokes -->
  <g stroke="url(#k8sBlue)" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="10" x2="32" y2="18"/>
    <line x1="32" y1="46" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="18" y2="32"/>
    <line x1="46" y1="32" x2="54" y2="32"/>
    <line x1="18.5" y1="18.5" x2="24" y2="24"/>
    <line x1="40" y1="40" x2="45.5" y2="45.5"/>
    <line x1="45.5" y1="18.5" x2="40" y2="24"/>
    <line x1="24" y1="40" x2="18.5" y2="45.5"/>
  </g>
</svg>
