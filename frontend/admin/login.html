<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Auth - DeepFace</title>
    <link rel="icon" href="./favicon.ico?v=20260509-3" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=20260509-3" />
    <link rel="stylesheet" href="../shared/background.css?v=20260509-2" />
    <link rel="stylesheet" href="./styles.css?v=20260509-2" />
    <style>
      body {
        overflow: auto !important;
      }

      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        position: relative;
        z-index: 1;
      }

      .auth-card {
        width: min(520px, 100%);
      }

      .auth-title {
        margin-bottom: 8px !important;
        color: #f8fafc !important;
        font-size: 30px !important;
        font-weight: 800 !important;
      }

      .auth-subtitle {
        color: #cbd5e1;
        line-height: 1.6;
        margin-bottom: 22px !important;
      }

      .auth-tabs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-bottom: 20px !important;
      }

      .auth-tab {
        border: 1px solid rgba(45, 212, 191, 0.25);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        color: #cbd5e1;
        cursor: pointer;
        font-weight: 700;
        padding: 12px 14px !important;
      }

      .auth-tab.active {
        background: linear-gradient(135deg, #2dd4bf, #1fb5a7);
        color: #041312;
      }

      .auth-form {
        display: grid;
        gap: 14px;
      }

      .auth-form[hidden] {
        display: none;
      }

      .auth-input {
        width: 100%;
        padding: 12px 14px !important;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(124, 196, 237, 0.35);
        border-radius: 8px;
        color: #fff;
      }

      .auth-input::placeholder {
        color: #94a3b8;
      }

      .auth-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 4px !important;
      }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <section class="card auth-card">
        <h1 class="auth-title">Admin DeepFace</h1>
        <p class="auth-subtitle">
          Đăng nhập nếu đã có tài khoản, hoặc đăng ký tài khoản admin mới để vào khu vực quản trị.
        </p>

        <div class="auth-tabs" aria-label="Chọn chế độ">
          <button class="auth-tab" type="button" id="show-login">Đăng nhập</button>
          <button class="auth-tab" type="button" id="show-register">Đăng ký</button>
        </div>

        <div id="auth-status" class="status-message" style="display: none"></div>

        <form id="login-form" class="auth-form">
          <input class="auth-input" id="login-username" autocomplete="username" placeholder="Tên tài khoản" required />
          <input class="auth-input" id="login-password" autocomplete="current-password" type="password" placeholder="Mật khẩu" required />
          <div class="auth-actions">
            <button class="btn btn-primary" type="submit">Đăng nhập</button>
            <a class="btn btn-secondary" href="http://localhost:3000">Trang chủ</a>
          </div>
        </form>

        <form id="register-form" class="auth-form" hidden>
          <input class="auth-input" id="register-username" autocomplete="username" placeholder="Tên tài khoản" required />
          <input class="auth-input" id="register-password" autocomplete="new-password" type="password" placeholder="Mật khẩu mới" required />
          <input class="auth-input" id="register-confirm" autocomplete="new-password" type="password" placeholder="Nhập lại mật khẩu" required />
          <div class="auth-actions">
            <button class="btn btn-primary" type="submit">Đăng ký</button>
            <a class="btn btn-secondary" href="http://localhost:3000">Trang chủ</a>
          </div>
        </form>
      </section>
    </main>

    <script src="../shared/background.js"></script>
    <script src="../shared/api.js?v=20260509-2"></script>
    <script src="./login.js?v=20260509-2"></script>
  </body>
</html>
