server {
    listen 80;
    server_name _;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    resolver 127.0.0.11 ipv6=off valid=10s;

    set $deepface_backend http://backend:8000;
    set $deepface_frontend_home http://frontend-home:80;
    set $deepface_frontend_admin http://frontend-admin:80;
    set $deepface_frontend_user http://frontend-user:80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    location = /health {
        proxy_pass $deepface_backend/health;
    }

    location /api/ {
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_pass $deepface_backend;
    }

    location = /admin {
        return 302 /admin/;
    }

    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass $deepface_frontend_admin;
    }

    location = /user {
        return 302 /user/;
    }

    location /user/ {
        rewrite ^/user/(.*)$ /$1 break;
        proxy_pass $deepface_frontend_user;
    }

    location /shared/ {
        proxy_pass $deepface_frontend_home;
    }

    location / {
        proxy_pass $deepface_frontend_home;
    }
}
