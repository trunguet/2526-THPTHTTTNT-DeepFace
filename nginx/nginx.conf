worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        resolver 127.0.0.11 valid=10s ipv6=off;

        set $backend_api backend:8000;
        set $frontend_home frontend-home:80;
        set $frontend_admin frontend-admin:80;
        set $frontend_user frontend-user:80;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location = /health {
            proxy_pass http://$backend_api/health;
        }

        location /api/ {
            proxy_pass http://$backend_api$request_uri;
        }

        location /uploads/ {
            proxy_pass http://$backend_api$request_uri;
        }

        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://$frontend_admin;
        }

        location = /user {
            return 301 /user/;
        }

        location /user/ {
            rewrite ^/user/(.*)$ /$1 break;
            proxy_pass http://$frontend_user;
        }

        location / {
            proxy_pass http://$frontend_home;
        }
    }
}
