services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: deepface_backend
    ports:
      - "18000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${TIDB_USER}:${TIDB_PASSWORD}@${TIDB_HOST}:${TIDB_PORT}/${TIDB_DATABASE}?charset=utf8mb4
      DATABASE_SSL: ${DATABASE_SSL:-true}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: face_embeddings
      VECTOR_SIZE: 512
      MATCH_THRESHOLD: 0.45
      PUBLIC_API_BASE_URL: http://localhost:18000
    depends_on:
      - redis
      - minio
      - qdrant
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: deepface_worker
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: mysql+pymysql://${TIDB_USER}:${TIDB_PASSWORD}@${TIDB_HOST}:${TIDB_PORT}/${TIDB_DATABASE}?charset=utf8mb4
      DATABASE_SSL: ${DATABASE_SSL:-true}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: face_embeddings
      VECTOR_SIZE: 512
      PUBLIC_API_BASE_URL: http://localhost:18000
    depends_on:
      - redis
      - minio
      - qdrant
    restart: unless-stopped

  frontend-admin:
    build:
      context: .
      dockerfile: frontend/admin/Dockerfile
    container_name: deepface_frontend_admin
    ports:
      - "3001:80"
    depends_on:
      - backend

  frontend-user:
    build:
      context: .
      dockerfile: frontend/user/Dockerfile
    container_name: deepface_frontend_user
    ports:
      - "3002:80"
    depends_on:
      - backend

  minio:
    image: minio/minio:latest
    container_name: deepface_minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  redis:
    image: redis:7-alpine
    container_name: deepface_redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: deepface_qdrant
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  minio_data:
  qdrant_data:
  redis_data:
