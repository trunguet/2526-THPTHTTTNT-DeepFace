services:
# Lưu trữ ảnh (MinIO):
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000" # Cổng cho API (Dùng cho Backend)
      - "9001:9001" # Cổng cho Console (Dùng trên Web)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - ./database/minio_data:/data
    command: server /data --console-address ":9001"
# Lưu trữ vector khuôn mặt (Qdrant):
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant_db
    ports:
      - "6333:6333" # Cổng cho API & Dashboard (Web)
      # http://localhost:6333/dashboard
      - "6334:6334" # Cổng gRPC (Dùng cho Backend tốc độ cao)
    volumes:
      - ./database/qdrant_data:/qdrant/storage
