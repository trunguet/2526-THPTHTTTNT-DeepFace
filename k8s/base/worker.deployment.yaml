apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepface-worker
  namespace: deepface
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepface-worker
  template:
    metadata:
      labels:
        app: deepface-worker
    spec:
      containers:
        - name: worker
          image: deepface_backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: deepface-config
            - secretRef:
                name: deepface-secrets
          volumeMounts:
            - name: deepface-weights
              mountPath: /root/.deepface/weights
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
      volumes:
        - name: deepface-weights
          emptyDir: {}

