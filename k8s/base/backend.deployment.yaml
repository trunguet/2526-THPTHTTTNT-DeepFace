apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepface-backend
  namespace: deepface
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepface-backend
  template:
    metadata:
      labels:
        app: deepface-backend
    spec:
      containers:
        - name: backend
          image: deepface_backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: deepface-config
            - secretRef:
                name: deepface-secrets
          # optional: store downloaded/cached weights in ephemeral volume
          volumeMounts:
            - name: deepface-weights
              mountPath: /root/.deepface/weights
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
      volumes:
        - name: deepface-weights
          emptyDir: {}
