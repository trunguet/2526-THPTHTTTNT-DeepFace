apiVersion: v1
kind: ConfigMap
metadata:
  name: deepface-config
  namespace: deepface
data:
  TZ: "Asia/Ho_Chi_Minh"

  # Managed DB / Redis / MinIO(S3-compatible) / Qdrant endpoints
  # NOTE: DATABASE_URL và MINIO keys phải nằm trong Secret, không để ở ConfigMap.
  DATABASE_SSL: "true"
  REDIS_URL: "redis://YOUR_REDIS_HOST:6379/0"
  MINIO_ENDPOINT: "YOUR_MINIO_HOST:9000"
  MINIO_BUCKET: "deepface-media"
  QDRANT_URL: "https://YOUR_QDRANT_ENDPOINT"
  QDRANT_COLLECTION: "face_embeddings"

  # App tuning
  PUBLIC_API_BASE_URL: "https://api.yourdomain"
  VECTOR_SIZE: "512"
  MATCH_THRESHOLD: "0.45"
  FACE_DEVICE: "cpu"
  ANTISPOOF_DEVICE_ID: "0"

  # Cache
  CACHE_REDIS_ENABLED: "true"
  CACHE_L1_MAX_ENTRIES: "512"
  CACHE_EMPLOYEES_TTL_SECONDS: "60"
  CACHE_LOGS_TTL_SECONDS: "60"
  CACHE_VERIFY_TTL_SECONDS: "0"

  # Optional: anti-spoof / quality gates (tune per camera)
  # ANTISPOOF_REAL_THRESHOLD: "0.5"
  # FAS_BBOX_PAD_RATIO: "0.15"
  # QUALITY_MIN_FRAME_BRIGHTNESS: "35"
  # QUALITY_MIN_FACE_BRIGHTNESS: "45"
  # QUALITY_MIN_FACE_HEIGHT_RATIO: "0.18"
  # QUALITY_MAX_FACE_HEIGHT_RATIO: "0.56"
  # QUALITY_MAX_FACE_ROLL_DEG: "25"
  # QUALITY_MIN_FACE_SHARPNESS: "60"
