apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deepface-minio-pvc
  namespace: deepface
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepface-minio
  namespace: deepface
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepface-minio
  template:
    metadata:
      labels:
        app: deepface-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            # Keep these aligned with the values you put in `deepface-secrets`
            # (MINIO_ACCESS_KEY/MINIO_SECRET_KEY) so the app can access MinIO.
            - name: MINIO_ROOT_USER
              value: "admin"
            - name: MINIO_ROOT_PASSWORD
              value: "password123"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deepface-minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: deepface-minio
  namespace: deepface
spec:
  selector:
    app: deepface-minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

