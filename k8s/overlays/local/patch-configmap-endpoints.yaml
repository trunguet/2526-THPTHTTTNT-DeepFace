apiVersion: v1
kind: ConfigMap
metadata:
  name: deepface-config
  namespace: deepface
data:
  # Local Kubernetes: chạy Redis/MinIO/Qdrant ngay trong cluster (overlay local).
  DATABASE_SSL: "true"
  REDIS_URL: "redis://deepface-redis:6379/0"
  MINIO_ENDPOINT: "deepface-minio:9000"
  MINIO_BUCKET: "deepface-media"
  QDRANT_URL: "http://deepface-qdrant:6333"
  QDRANT_COLLECTION: "face_embeddings"

  # Khi chạy overlay local (NodePort), API sẽ ở localhost:31800.
  PUBLIC_API_BASE_URL: "http://localhost:31800"

  # Kubernetes local: tránh bị kill do startup lâu (load model/khởi tạo deps).
  STRICT_STARTUP: "false"
  PRELOAD_MODELS: "false"
  INIT_EXTERNAL_DEPENDENCIES: "true"
  # Optional: if you only want to test UI/health and not run worker jobs
  # (worker will still start, but it won't init external deps).
