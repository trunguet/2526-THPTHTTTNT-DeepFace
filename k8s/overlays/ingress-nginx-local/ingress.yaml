apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deepface-ingress
  namespace: deepface
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    # Home UI (and /api proxy) on a single host.
    - host: deepface.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: deepface-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deepface-frontend-home
                port:
                  number: 80

    # User UI on subdomain.
    - host: app.deepface.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: deepface-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deepface-frontend-user
                port:
                  number: 80

    # Admin UI on subdomain.
    - host: admin.deepface.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: deepface-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deepface-frontend-admin
                port:
                  number: 80

