apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base app + local dependencies (redis/minio/qdrant)
resources:
  - ../local
  - ingress.yaml

# Ingress needs ClusterIP services (NodePort not required)
patches:
  - path: patch-configmap-public-url.yaml

patchesJson6902:
  - target:
      version: v1
      kind: Service
      name: deepface-backend
      namespace: deepface
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      version: v1
      kind: Service
      name: deepface-frontend-home
      namespace: deepface
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      version: v1
      kind: Service
      name: deepface-frontend-user
      namespace: deepface
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      version: v1
      kind: Service
      name: deepface-frontend-admin
      namespace: deepface
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
