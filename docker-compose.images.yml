# Image-only Compose file for grading/release.
# This file contains no local build sections; Docker Compose pulls every
# project-owned image from BACKEND_IMAGE / FRONTEND_*_IMAGE / BACKUP_IMAGE.

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: deepface_gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend-home
      - frontend-admin
      - frontend-user
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env.dockerhub}
    container_name: deepface_backend
    ports:
      - "18000:8000"
    environment:
      TZ: Asia/Ho_Chi_Minh
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${TIDB_USER:-root}:${TIDB_PASSWORD:-deepface_root_password}@${TIDB_HOST:-mysql}:${TIDB_PORT:-3306}/${TIDB_DATABASE:-DB_Employee}?charset=utf8mb4}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-password123}
      MINIO_BUCKET: ${MINIO_BUCKET:-deepface-media}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-face_embeddings}
      VECTOR_SIZE: 512
      MATCH_THRESHOLD: 0.45
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET:-dev-secret-change-me}
      ADMIN_TOKEN_TTL_SECONDS: ${ADMIN_TOKEN_TTL_SECONDS:-86400}
      CACHE_REDIS_ENABLED: ${CACHE_REDIS_ENABLED:-true}
      CACHE_L1_MAX_ENTRIES: ${CACHE_L1_MAX_ENTRIES:-512}
      CACHE_EMPLOYEES_TTL_SECONDS: ${CACHE_EMPLOYEES_TTL_SECONDS:-60}
      CACHE_LOGS_TTL_SECONDS: ${CACHE_LOGS_TTL_SECONDS:-60}
      CACHE_VERIFY_TTL_SECONDS: ${CACHE_VERIFY_TTL_SECONDS:-0}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./model_cache:/root/.deepface/weights

  worker:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env.dockerhub}
    container_name: deepface_worker
    command: ["python", "-m", "app.worker"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${TIDB_USER:-root}:${TIDB_PASSWORD:-deepface_root_password}@${TIDB_HOST:-mysql}:${TIDB_PORT:-3306}/${TIDB_DATABASE:-DB_Employee}?charset=utf8mb4}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-password123}
      MINIO_BUCKET: ${MINIO_BUCKET:-deepface-media}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-face_embeddings}
      VECTOR_SIZE: 512
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      CACHE_REDIS_ENABLED: ${CACHE_REDIS_ENABLED:-true}
      CACHE_L1_MAX_ENTRIES: ${CACHE_L1_MAX_ENTRIES:-512}
      CACHE_EMPLOYEES_TTL_SECONDS: ${CACHE_EMPLOYEES_TTL_SECONDS:-60}
      CACHE_LOGS_TTL_SECONDS: ${CACHE_LOGS_TTL_SECONDS:-60}
      CACHE_VERIFY_TTL_SECONDS: ${CACHE_VERIFY_TTL_SECONDS:-0}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./model_cache:/root/.deepface/weights

  frontend-home:
    image: ${FRONTEND_HOME_IMAGE:?Set FRONTEND_HOME_IMAGE in .env.dockerhub}
    container_name: deepface_frontend_home
    ports:
      - "3000:80"
    depends_on:
      - frontend-admin
      - frontend-user

  frontend-admin:
    image: ${FRONTEND_ADMIN_IMAGE:?Set FRONTEND_ADMIN_IMAGE in .env.dockerhub}
    container_name: deepface_frontend_admin
    ports:
      - "3001:80"
    depends_on:
      - backend

  frontend-user:
    image: ${FRONTEND_USER_IMAGE:?Set FRONTEND_USER_IMAGE in .env.dockerhub}
    container_name: deepface_frontend_user
    ports:
      - "3002:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.4
    container_name: deepface_mysql
    ports:
      - "13306:3306"
    command: ["--default-time-zone=+07:00"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-deepface_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-DB_Employee}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-deepface_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: deepface_minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      TZ: Asia/Ho_Chi_Minh
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deepface_redis
    ports:
      - "16379:6379"
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: deepface_qdrant
    ports:
      - "16333:6333"
      - "16334:6334"
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - qdrant_data:/qdrant/storage

  backup:
    image: ${BACKUP_IMAGE:?Set BACKUP_IMAGE in .env.dockerhub}
    container_name: deepface_backup
    environment:
      TZ: Asia/Ho_Chi_Minh
      BACKUP_DIR: /backups
      RETENTION_DAYS: 7
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-DB_Employee}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-deepface_root_password}
      ENABLE_REDIS_BACKUP: "false"
    volumes:
      - ./backups:/backups
      - minio_data:/data/minio:ro
      - qdrant_data:/data/qdrant:ro
      - redis_data:/data/redis:ro
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  mysql_data:
  minio_data:
  qdrant_data:
  redis_data:
