<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepFace - Chọn Vai Trò</title>
    <link rel="stylesheet" href="./frontend/shared/background.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .selector-container {
            text-align: center;
            padding: 40px;
        }
        .selector-title {
            font-size: 48px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 20px;
        }
        .selector-subtitle {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 40px;
            max-width: 600px;
        }
        .role-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .role-button {
            display: block;
            padding: 20px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
        }
        .role-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .admin-btn {
            background: linear-gradient(135deg, #2dd4bf, #1fb5a7);
            color: #041312;
        }
        .user-btn {
            background: linear-gradient(135deg, #7cc4ed, #2097bc);
            color: #041312;
        }
    </style>
</head>
<body>
    <div class="selector-container glass-panel">
        <h1 class="selector-title">🎭 DeepFace</h1>
        <p class="selector-subtitle">Chào mừng bạn đến với hệ thống nhận diện khuôn mặt. Vui lòng chọn vai trò của bạn để tiếp tục.</p>
        <div class="role-buttons">
            <a href="http://localhost:3001/login.html" class="role-button admin-btn">Quản Trị Viên</a>
            <a href="http://localhost:3002/login.html" class="role-button user-btn">Nhân Viên</a>
        </div>
    </div>
    <script src="./frontend/shared/background.js"></script>
</body>
</html>
